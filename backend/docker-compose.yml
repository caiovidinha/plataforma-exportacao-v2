name: plataforma-exportacao

x-service: &service
  build: .
  restart: unless-stopped
  environment:
    KAFKA_BROKERS: kafka:9092
  depends_on:
    kafka:
      condition: service_healthy

services:
  # ── Barramento de eventos (Kafka em modo KRaft, single-node) ──
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: exportacao-cluster-0001
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 12

  # ── Serviços de aplicação ──
  gateway:
    <<: *service
    command: node services/gateway/index.js
    ports: ["4000:4000"]
    environment:
      KAFKA_BROKERS: kafka:9092
      IDENTITY_URL: http://identity-service:4001
      CATALOG_URL: http://catalog-service:4002
      ORDER_URL: http://order-service:4003
      WORKFLOW_URL: http://workflow-service:4004
      PARTNER_URL: http://partner-service:4005

  identity-service:
    <<: *service
    command: node services/identity-service/index.js
    ports: ["4001:4001"]

  catalog-service:
    <<: *service
    command: node services/catalog-service/index.js
    ports: ["4002:4002"]

  order-service:
    <<: *service
    command: node services/order-service/index.js
    ports: ["4003:4003"]

  workflow-service:
    <<: *service
    command: node services/workflow-service/index.js
    ports: ["4004:4004"]

  partner-service:
    <<: *service
    command: node services/partner-service/index.js
    ports: ["4005:4005"]
